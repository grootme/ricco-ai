[pytest]
# Configuración de pytest para OpenClaw Agent SaaS

# Patrones de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directorios de test
testpaths = tests

# Marcadores personalizados
markers =
    asyncio: mark test as async
    slow: mark test as slow running
    integration: mark test as integration test
    requires_docker: mark test that requires Docker
    unit: mark test as unit test
    comprehensive: mark test as comprehensive validation
    stress: mark test as stress/performance test
    security: mark test as security validation
    ethics: mark test as ethics validation

# Configuración de asyncio
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Opciones de ejecución
addopts = 
    -v
    --tb=short
    --strict-markers
    --strict-config
    --durations=20
    --durations-min=0.1
    -ra
    --color=yes

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %H:%M:%S

# Advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::urllib3.exceptions.InsecureRequestWarning

# Cobertura mínima (descomentar para aplicar)
# --cov=src --cov-report=html --cov-report=term --cov-fail-under=80

# Timeout (requiere pytest-timeout)
timeout = 300
timeout_method = thread

# Paralelización (requiere pytest-xdist)
# addopts = -n auto
