# =============================================================================
# RICCO-AI Domain Configuration
# =============================================================================
# Este archivo define los dominios de especialización de agentes.
# Para agregar un nuevo dominio, simplemente añade una nueva entrada.
# NO requiere modificar código fuente - cumple OCP de SOLID.
#
# Estructura de cada dominio:
#   id: Identificador único (usado en código)
#   elegant_name: Nombre para mostrar (branding)
#   display_name: Nombre legible
#   description: Descripción completa
#   icon: Icono para UI (lucide-react)
#   color: Color hexadecimal para branding
#   default_skills: Skills por defecto para agentes de este dominio
#   default_tools: Tools por defecto
#   default_mcp_servers: MCP servers por defecto
#   keywords: Palabras clave para detección automática
# =============================================================================

domains:
  codex:
    id: "codex"
