    display_name: "Software Engineering"
    description: "Desarrollo de software, debugging, code review y arquitectura de sistemas"
    icon: "code"
    color: "#3B82F6"
    category: "engineering"
    default_skills:
      - "code-generation"
      - "debugging"
      - "code-review"
      - "architecture-design"
      - "refactoring"
    default_tools:
      - "git"
      - "code-executor"
      - "linter"
      - "docker"
      - "ci-cd"
    default_mcp_servers:
      - "github"
      - "filesystem"
      - "docker"
    keywords:
      - "code"
      - "codigo"
      - "program"
      - "develop"
      - "software"
      - "app"
      - "api"
      - "bug"
      - "function"
      - "debug"
