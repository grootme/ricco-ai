# RICCO AI - Alertmanager Configuration
# Route alerts to appropriate receivers

global:
  resolve_timeout: 5m
  # Slack configuration (uncomment and configure)
  # slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Inhibition rules - prevent certain alerts when others are firing
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname', 'instance']

# Route tree
route:
  receiver: 'default-receiver'
  group_by: ['alertname', 'severity', 'category']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    # Critical alerts - immediate notification
    - matchers:
        - severity="critical"
      receiver: 'critical-alerts'
      group_wait: 10s
      repeat_interval: 1h

    # Security alerts
    - matchers:
        - category="security"
      receiver: 'security-alerts'
      group_wait: 30s
      repeat_interval: 1h

    # Cost alerts
    - matchers:
        - category="cost"
      receiver: 'cost-alerts'
      group_wait: 5m
      repeat_interval: 12h

    # Infrastructure alerts
    - matchers:
        - category="infrastructure"
      receiver: 'infrastructure-alerts'
      group_wait: 1m
      repeat_interval: 2h

    # LLM/AI provider alerts
    - matchers:
        - category="llm"
      receiver: 'ai-alerts'
      group_wait: 2m
      repeat_interval: 2h

    # Database alerts
    - matchers:
        - category="database"
      receiver: 'database-alerts'
      group_wait: 2m
      repeat_interval: 2h

# Receivers
receivers:
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/critical'
        send_resolved: true
    # Slack configuration (uncomment to enable)
    # slack_configs:
    #   - channel: '#critical-alerts'
    #     send_resolved: true
    #     title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
    #     text: >-
    #       {{ range .Alerts }}
    #       *Alert:* {{ .Labels.alertname }}
    #       *Severity:* {{ .Labels.severity }}
    #       *Description:* {{ .Annotations.description }}
    #       *Details:*
    #       {{ range .Labels.SortedPairs }} • *{{ .Name }}:* {{ .Value }}
    #       {{ end }}
    #       {{ end }}

  - name: 'security-alerts'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/security'
        send_resolved: true

  - name: 'cost-alerts'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/cost'
        send_resolved: true

  - name: 'infrastructure-alerts'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/infrastructure'
        send_resolved: true

  - name: 'ai-alerts'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/ai'
        send_resolved: true

  - name: 'database-alerts'
    webhook_configs:
      - url: 'http://ricco-backend:8000/api/v1/alerts/database'
        send_resolved: true

# Templates
templates: []
