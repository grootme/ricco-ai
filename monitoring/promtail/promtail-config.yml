# RICCO AI - Promtail Configuration
# Log shipping configuration

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    tenant_id: ricco-ai

scrape_configs:
  # ===========================================================================
  # Application Logs
  # ===========================================================================
  - job_name: ricco-app
    static_configs:
      - targets:
          - localhost
        labels:
          job: ricco-app
          environment: production
          __path__: /app/logs/*.log
    pipeline_stages:
      - match:
          selector: '{job="ricco-app"}'
          stages:
            - regex:
                expression: '^(?P<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) \| (?P<level>\w+) \| (?P<logger>[\w.]+) \| (?P<message>.*)$'
            - labels:
                level:
                logger:
            - timestamp:
                source: time
                format: "2006-01-02 15:04:05,000"

  # ===========================================================================
  # System Logs
  # ===========================================================================
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log
    pipeline_stages:
      - match:
          selector: '{job="system"}'
          stages:
            - regex:
                expression: '^(?P<time>\w+ \d+ \d+:\d+:\d+) (?P<hostname>\w+) (?P<service>\w+)(\[(?P<pid>\d+)\])?: (?P<message>.*)$'
            - labels:
                hostname:
                service:

  # ===========================================================================
  # Docker Container Logs
  # ===========================================================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=ricco-ai"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            logger: logger
      - labels:
          level:
          logger:

  # ===========================================================================
  # Nginx Access Logs
  # ===========================================================================
  - job_name: nginx
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>[\d.]+) - (?P<remote_user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>\w+) (?P<path>\S+) (?P<protocol>[^"]+)" (?P<status>\d+) (?P<body_bytes>\d+) "(?P<referer>[^"]*)" "(?P<user_agent>[^"]*)"(?: (?P<response_time>\d+))?$'
      - labels:
          remote_addr:
          method:
          status:
      - metrics:
          http_requests_total:
            type: Counter
            description: "Total HTTP requests"
            source: status
            config:
              action: inc
          http_request_duration_seconds:
            type: Histogram
            description: "HTTP request duration"
            source: response_time
            config:
              buckets: [0.1, 0.5, 1, 5, 10]
