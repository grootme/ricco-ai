# RICCO AI - Prometheus Alert Rules
# Comprehensive alerting for all system components

groups:
  # ===========================================================================
  # Application Health Alerts
  # ===========================================================================
  - name: ricco_app_health
    interval: 30s
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "{{ $labels.job }} instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(ricco_http_requests_total{status_code=~"5.."}[5m])) 
          / 
          sum(rate(ricco_http_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          category: application
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }}. More than 5% of requests are failing."

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, rate(ricco_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Slow HTTP responses detected"
          description: "95th percentile response time is {{ $value | humanizeDuration }}."

  # ===========================================================================
  # Agent Performance Alerts
  # ===========================================================================
  - name: ricco_agents
    interval: 30s
    rules:
      - alert: AgentExecutionTimeHigh
        expr: |
          histogram_quantile(0.90, rate(ricco_agent_execution_duration_seconds_bucket[10m])) > 60
        for: 10m
        labels:
          severity: warning
          category: agent
        annotations:
          summary: "Agent execution time is high"
          description: "Agent {{ $labels.agent_type }} 90th percentile execution time is {{ $value | humanizeDuration }}."

      - alert: AgentErrorRateHigh
        expr: |
          sum(rate(ricco_agent_requests_total{status="error"}[5m])) 
          / 
          sum(rate(ricco_agent_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          category: agent
        annotations:
          summary: "High agent error rate"
          description: "Agent error rate is {{ $value | humanizePercentage }}. More than 10% of agent requests are failing."

      - alert: AgentMemoryHigh
        expr: ricco_agent_memory_usage_bytes > 1073741824  # 1GB
        for: 10m
        labels:
          severity: warning
          category: agent
        annotations:
          summary: "Agent memory usage is high"
          description: "Agent {{ $labels.agent_id }} is using {{ $value | humanizeBytes }} of memory."

  # ===========================================================================
  # MCP Server Alerts
  # ===========================================================================
  - name: ricco_mcp
    interval: 30s
    rules:
      - alert: MCPServerUnhealthy
        expr: ricco_mcp_server_health == 0
        for: 2m
        labels:
          severity: critical
          category: mcp
        annotations:
          summary: "MCP server is unhealthy"
          description: "MCP server {{ $labels.server_id }} has been unhealthy for more than 2 minutes."

      - alert: MCPToolLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(ricco_mcp_tool_duration_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          category: mcp
        annotations:
          summary: "MCP tool latency is high"
          description: "Tool {{ $labels.tool_name }} 95th percentile latency is {{ $value | humanizeDuration }}."

      - alert: MCPToolErrorsHigh
        expr: |
          sum(rate(ricco_mcp_tool_invocations_total{status="error"}[5m])) 
          / 
          sum(rate(ricco_mcp_tool_invocations_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          category: mcp
        annotations:
          summary: "High MCP tool error rate"
          description: "MCP tool error rate is {{ $value | humanizePercentage }}."

  # ===========================================================================
  # Rate Limiting Alerts
  # ===========================================================================
  - name: ricco_rate_limiting
    interval: 30s
    rules:
      - alert: HighRateLimitBlocks
        expr: |
          sum(rate(ricco_rate_limit_total{result="blocked"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: security
        annotations:
          summary: "High rate limit blocks detected"
          description: "More than 10 requests per second are being blocked on {{ $labels.route }}."

      - alert: RateLimitAbuse
        expr: |
          sum(increase(ricco_rate_limit_total{result="blocked"}[1h])) > 1000
        for: 0m
        labels:
          severity: critical
          category: security
        annotations:
          summary: "Potential API abuse detected"
          description: "Over 1000 rate limit blocks in the last hour. Possible abuse or DDoS attack."

  # ===========================================================================
  # LLM Provider Alerts
  # ===========================================================================
  - name: ricco_llm
    interval: 30s
    rules:
      - alert: LLMHighLatency
        expr: |
          histogram_quantile(0.95, rate(ricco_llm_request_duration_seconds_bucket[5m])) > 30
        for: 5m
        labels:
          severity: warning
          category: llm
        annotations:
          summary: "LLM API latency is high"
          description: "{{ $labels.provider }}/{{ $labels.model }} 95th percentile latency is {{ $value | humanizeDuration }}."

      - alert: LLMErrorRateHigh
        expr: |
          sum(rate(ricco_llm_requests_total{status="error"}[5m])) 
          / 
          sum(rate(ricco_llm_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
          category: llm
        annotations:
          summary: "High LLM error rate"
          description: "LLM error rate is {{ $value | humanizePercentage }}."

      - alert: LLMTokenUsageHigh
        expr: |
          sum(rate(ricco_llm_tokens_used_total[1h])) > 100000
        for: 5m
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "High LLM token usage"
          description: "Token usage rate is {{ $value | humanize }} tokens/hour. Monitor costs."

      - alert: LLMCostAnomaly
        expr: |
          increase(ricco_llm_cost_total_dollars[1h]) > 100
        for: 0m
        labels:
          severity: warning
          category: cost
        annotations:
          summary: "High LLM cost increase"
          description: "LLM costs increased by ${{ $value }} in the last hour."

  # ===========================================================================
  # Database Alerts
  # ===========================================================================
  - name: ricco_database
    interval: 30s
    rules:
      - alert: DatabaseConnectionsHigh
        expr: ricco_db_connections_active > 80
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "High number of database connections"
          description: "Database {{ $labels.database }} has {{ $value }} active connections."

      - alert: DatabaseQuerySlow
        expr: |
          histogram_quantile(0.95, rate(ricco_db_query_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: database
        annotations:
          summary: "Slow database queries detected"
          description: "95th percentile query time is {{ $value | humanizeDuration }}."

      - alert: DatabaseErrorsHigh
        expr: |
          sum(rate(ricco_db_errors_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
          category: database
        annotations:
          summary: "Database errors detected"
          description: "Database is experiencing {{ $value | humanize }} errors/second."

  # ===========================================================================
  # Queue Alerts
  # ===========================================================================
  - name: ricco_queue
    interval: 30s
    rules:
      - alert: QueueBacklogHigh
        expr: ricco_queue_size > 10000
        for: 10m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "Queue backlog is high"
          description: "Queue {{ $labels.queue_name }} has {{ $value }} messages waiting."

      - alert: QueueProcessingSlow
        expr: |
          histogram_quantile(0.95, rate(ricco_queue_processing_time_seconds_bucket[5m])) > 5
        for: 5m
        labels:
          severity: warning
          category: queue
        annotations:
          summary: "Queue processing is slow"
          description: "Queue {{ $labels.queue_name }} 95th percentile processing time is {{ $value | humanizeDuration }}."

  # ===========================================================================
  # Infrastructure Alerts
  # ===========================================================================
  - name: ricco_infrastructure
    interval: 30s
    rules:
      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) 
          / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      - alert: HighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value | humanizePercentage }}."

      - alert: DiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.1
        for: 5m
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Low disk space"
          description: "Disk {{ $labels.mountpoint }} has less than 10% space available."

      - alert: DiskSpaceWarning
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.2
        for: 5m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Disk space warning"
          description: "Disk {{ $labels.mountpoint }} has less than 20% space available."
