# RICCO AI - Prometheus Configuration
# Comprehensive metrics collection for all services

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: 'production'
    cluster: 'ricco-ai'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Rule files
rule_files:
  - /etc/prometheus/alerts/*.yml

# Scrape configurations
scrape_configs:
  # ===========================================================================
  # Prometheus self-monitoring
  # ===========================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ===========================================================================
  # RICCO AI Backend
  # ===========================================================================
  - job_name: 'ricco-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
    scrape_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'ricco-backend'

  # ===========================================================================
  # Node Exporter (Host Metrics)
  # ===========================================================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ===========================================================================
  # Redis Exporter
  # ===========================================================================
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # ===========================================================================
  # PostgreSQL Exporter
  # ===========================================================================
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # ===========================================================================
  # Qdrant Vector DB
  # ===========================================================================
  - job_name: 'qdrant'
    static_configs:
      - targets: ['openclaw-qdrant:6333']
    metrics_path: /metrics

  # ===========================================================================
  # Milvus Vector DB
  # ===========================================================================
  - job_name: 'milvus'
    static_configs:
      - targets: ['openclaw-milvus:9091']
    metrics_path: /metrics

  # ===========================================================================
  # Jaeger (traces)
  # ===========================================================================
  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']
    metrics_path: /metrics

  # ===========================================================================
  # Grafana
  # ===========================================================================
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # ===========================================================================
  # Alertmanager
  # ===========================================================================
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics

