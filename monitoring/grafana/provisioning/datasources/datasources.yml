# RICCO AI - Grafana Datasources
# Auto-provisioned data sources

apiVersion: 1

datasources:
  # Prometheus - Primary metrics source
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.48.0"

  # Loki - Log aggregation
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

  # Jaeger - Distributed tracing
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false

  # Redis - For cache metrics
  - name: Redis
    type: redis
    access: proxy
    url: redis://openclaw-redis:6379
    editable: false
    jsonData:
      client: standalone

  # PostgreSQL - For database metrics
  - name: PostgreSQL
    type: postgres
    access: proxy
    url: openclaw-postgres:5432
    database: openclaw
    user: openclaw
    editable: false
    secureJsonData:
      password: openclaw_secret
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1600
