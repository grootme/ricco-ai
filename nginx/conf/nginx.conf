# Nginx configuration for Ecosystem Services
# Routes requests to: DeerFlow, Engram, ricco-ai, gentle-ai, gentle-pi

worker_processes 1;
error_log logs/error.log;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream definitions
    upstream deerflow {
        server 127.0.0.1:8000;
    }

    upstream engram {
        server 127.0.0.1:8080;
    }

    upstream ricco_ai {
        server 127.0.0.1:3000;
    }

    # Main server block
    server {
        listen 8088;
        server_name localhost;

        # Main entry point - ricco-ai
        location / {
            proxy_pass http://ricco_ai;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # DeerFlow agent endpoints
        location /deerflow/ {
            rewrite ^/deerflow/(.*) /$1 break;
            proxy_pass http://deerflow;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Engram memory endpoints
        location /engram/ {
            rewrite ^/engram/(.*) /$1 break;
            proxy_pass http://engram;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API aggregation endpoint
        location /api/v1/ {
            proxy_pass http://ricco_ai/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE streaming support
        location ~ ^/(deerflow|engram|ricco)/sse/ {
            proxy_pass http://ricco_ai;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
        }

        # Health check endpoint
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Status page
        location /nginx-status {
            stub_status on;
            access_log off;
        }
    }
}
