# Grafana Dashboard Provisioning

apiVersion: 1

providers:
  - name: 'RICCO AI Dashboards'
    orgId: 1
    folder: 'RICCO AI'
    folderUid: 'ricco-ai'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
