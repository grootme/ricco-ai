# RICCO AI Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ricco-ai'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load alerting rules
rule_files:
  - /etc/prometheus/alerts/*.yml

# Scrape configurations
scrape_configs:
  # ==========================================
  # Prometheus self-monitoring
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # ==========================================
  # RICCO AI Application
  # ==========================================
  - job_name: 'ricco-ai'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: /metrics
    scrape_interval: 10s

  # ==========================================
  # Node Exporter - System Metrics
  # ==========================================
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # ==========================================
  # cAdvisor - Container Metrics
  # ==========================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # ==========================================
  # OpenTelemetry Collector
  # ==========================================
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # ==========================================
  # Grafana
  # ==========================================
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # ==========================================
  # Loki
  # ==========================================
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
    metrics_path: /metrics

  # ==========================================
  # Tempo
  # ==========================================
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']
    metrics_path: /metrics

  # ==========================================
  # Alertmanager
  # ==========================================
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
    metrics_path: /metrics

  # ==========================================
  # Redis (if available)
  # ==========================================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

  # ==========================================
  # PostgreSQL (if available)
  # ==========================================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    metrics_path: /metrics

  # ==========================================
  # Qdrant Vector DB
  # ==========================================
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /metrics

  # ==========================================
  # Custom RICCO Services
  # ==========================================
  - job_name: 'ricco-agents'
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: /metrics

  - job_name: 'ricco-mcp'
    static_configs:
      - targets: ['host.docker.internal:8002']
    metrics_path: /metrics

  - job_name: 'ricco-streaming'
    static_configs:
      - targets: ['host.docker.internal:8003']
    metrics_path: /metrics
