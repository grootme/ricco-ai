[project]
name = "ricco-ai"
version = "2.0.0"
description = "RICCO AI Service - Advanced AI capabilities with FastAPI, TensorFlow, and Agent protocols"
authors = [{name = "RICCO Team", email = "team@ricco.cu"}]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Core Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-multipart>=0.0.6",
    
    # Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    
    # Async & HTTP
    "httpx>=0.26.0",
    "aiohttp>=3.9.0",
    "aiocache>=0.12.0",
    
    # Database
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    
    # AI/ML Core - LLMs
    "openai>=1.10.0",
    "anthropic>=0.18.0",
    
    # LangChain Ecosystem
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.20",
    "langchain-openai>=0.0.5",
    "langchain-anthropic>=0.1.0",
    "langchain-text-splitters>=0.0.1",
    "langgraph>=0.0.40",
    
    # Embeddings
    "sentence-transformers>=2.3.0",
    "tiktoken>=0.5.0",
    
    # Vector Stores
    "chromadb>=0.4.0",
    "pinecone-client>=3.0.0",
    
    # RAG Components
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "flashrank>=0.1.0",
    
    # TensorFlow / Keras
    "tensorflow>=2.15.0",
    "keras>=3.0.0",
    "numpy>=1.26.0",
    "pillow>=10.2.0",
    
    # Document Processing
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "markdown>=3.5.0",
    
    # OCR
    "pytesseract>=0.3.10",
    
    # NLP
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    
    # Monitoring & Logging
    "prometheus-client>=0.19.0",
    "structlog>=24.1.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    
    # Observability
    "langfuse>=2.0.0",
    
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.1.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "ipython>=8.20.0",
]

gpu = [
    "tensorflow[and-cuda]>=2.15.0",
    "faiss-gpu>=1.7.4",
    "torch>=2.2.0",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
]

# Evo-ai integration
evoai = [
    "google-adk>=0.1.0",
    "crewai>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
